<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Serif+KR:wght@200;300;400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #fff;
    color: #1b1c1e;
    font-family: "Noto Serif KR", serif;
    position: relative; overflow: hidden;
  }
  .frame { position: absolute; inset: 26px; border: 1px solid #e4e6e8; }
  .ring { position: absolute; right: -150px; bottom: -230px; color: #b8bdc2; opacity: .32; }
  .lines::before, .lines::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 1px; background: #f0f2f3;
  }
  .lines::before { left: 150px; } .lines::after { right: 150px; }
  .center {
    position: absolute; left: 0; right: 0; top: 96px; text-align: center;
  }
  .logo { font-family: "Cormorant Garamond", serif; font-size: 32px; letter-spacing: .44em; padding-left: .44em; }
  .since { margin-top: 10px; font-family: sans-serif; font-size: 9px; letter-spacing: .34em; color: #8b9095; }
  .rule { width: 40px; height: 1px; background: #b8bdc2; margin: 38px auto 34px; }
  .en { font-family: "Cormorant Garamond", serif; font-weight: 300; font-size: 60px; line-height: 1.22; letter-spacing: .03em; }
  .ko { margin-top: 22px; font-size: 19px; font-weight: 300; letter-spacing: .18em; color: #3d3f42; }
  .bottom {
    position: absolute; left: 0; right: 0; bottom: 62px; text-align: center;
    font-family: sans-serif; font-size: 10.5px; letter-spacing: .2em; color: #8b9095;
  }
  .bottom span { color: #b3b8bc; margin: 0 10px; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="lines"></div>
  <svg class="ring" width="560" height="560" viewBox="0 0 560 560" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="280" cy="280" r="240" stroke="currentColor" stroke-width="0.8"/>
    <circle cx="280" cy="280" r="208" stroke="currentColor" stroke-width="0.4"/>
  </svg>
  <div class="center">
    <div class="logo">JEWDE</div>
    <div class="since">SINCE 1989 · INCHEON</div>
    <div class="rule"></div>
    <div class="en">Add Value To<br>One’s Precious Memory</div>
    <div class="ko">소중한 기억에 가치를 더하다</div>
  </div>
  <div class="bottom">청담 예물 명가<span>·</span>쥬드주얼리 인천점<span>·</span>인천 구월동</div>
</body>
</html>
